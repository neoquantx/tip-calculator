<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #ffffff;
      --text: #1a2420;
      --muted: #5c6c65;
      --line: #d5e0da;
      --green: #157a48;
      --green-dark: #0e5c36;
      --green-soft: #e7f6ee;
      --danger: #9d2222;
      --danger-bg: #fdf3f3;
      --shadow: 0 18px 48px rgba(22, 40, 30, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #f8fbf9 0%, var(--bg) 58%);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: min(100%, 440px);
      margin: auto;
      background: var(--card);
      border: 1px solid rgba(213, 224, 218, 0.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 24px 22px;
    }

    .heading {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .mark {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .field {
      margin-top: 18px;
    }

    label,
    .field-label {
      display: block;
      font-weight: 650;
      font-size: 0.92rem;
      margin-bottom: 8px;
    }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .with-affix {
      position: relative;
    }

    .affix {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 650;
      pointer-events: none;
    }

    .affix-start {
      left: 14px;
    }

    .affix-end {
      right: 14px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 1.05rem;
      color: var(--text);
      background: #fbfcfb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    input.pad-start {
      padding-left: 30px;
    }

    input.pad-end {
      padding-right: 34px;
    }

    input:hover {
      border-color: #b7c9c0;
    }

    input:focus {
      outline: 2px solid var(--green);
      outline-offset: 2px;
      border-color: var(--green);
      background: #fff;
    }

    input[aria-invalid="true"] {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .presets button,
    .stepper button,
    .reset {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
    }

    .presets button {
      font-weight: 700;
      padding: 11px 0;
    }

    .presets button:hover,
    .stepper button:hover:not(:disabled),
    .reset:hover {
      border-color: var(--green);
      color: var(--green-dark);
    }

    .presets button:focus-visible,
    .stepper button:focus-visible,
    .reset:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    .presets button:active,
    .stepper button:active:not(:disabled),
    .reset:active {
      background: var(--green-soft);
    }

    .presets button[aria-pressed="true"] {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .presets button[aria-pressed="true"]:hover {
      background: var(--green-dark);
      border-color: var(--green-dark);
      color: #fff;
    }

    .stepper {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      gap: 8px;
      align-items: center;
    }

    .stepper button {
      height: 48px;
      font-size: 1.35rem;
      line-height: 1;
    }

    .stepper button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .message {
      margin: 16px 0 0;
      min-height: 1.3em;
      color: var(--danger);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .message:empty {
      margin-top: 0;
    }

    .results {
      margin-top: 16px;
      background: var(--green-soft);
      border-radius: 18px;
      padding: 18px 16px 14px;
    }

    .per-person {
      margin: 0;
    }

    .per-person .label,
    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .per-person .amount {
      display: block;
      margin-top: 4px;
      font-size: 2.6rem;
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--green-dark);
    }

    .per-person .amount.is-empty,
    .stat .amount.is-empty {
      color: #8aa094;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(14, 92, 54, 0.14);
    }

    .stat {
      margin: 0;
    }

    .stat .amount {
      display: block;
      margin-top: 4px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .reset {
      width: 100%;
      margin-top: 16px;
      padding: 12px 14px;
      font-weight: 700;
    }

    noscript .card {
      margin: 24px auto;
    }

    @media (max-width: 380px) {
      .card {
        padding: 22px 16px 16px;
      }

      h1 {
        font-size: 1.45rem;
      }

      .presets {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .per-person .amount {
        font-size: 2.2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="heading">
      <div class="mark" aria-hidden="true">$</div>
      <div>
        <h1>Tip Calculator</h1>
        <p class="subtitle">Split a restaurant bill, with tip, across your table.</p>
      </div>
    </header>

    <form id="tip-form" novalidate>
      <div class="field">
        <label for="bill">Bill amount</label>
        <div class="with-affix">
          <span class="affix affix-start" aria-hidden="true">$</span>
          <input
            id="bill"
            name="bill"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            placeholder="0.00"
            class="pad-start"
            aria-describedby="form-message"
          >
        </div>
      </div>

      <div class="field">
        <div class="field-label" id="tip-presets-label">Tip percentage</div>
        <div class="presets" role="group" aria-labelledby="tip-presets-label">
          <button type="button" data-tip="10" aria-pressed="false">10%</button>
          <button type="button" data-tip="15" aria-pressed="true">15%</button>
          <button type="button" data-tip="18" aria-pressed="false">18%</button>
          <button type="button" data-tip="20" aria-pressed="false">20%</button>
        </div>
      </div>

      <div class="field">
        <label for="tip">Custom tip percentage</label>
        <div class="with-affix">
          <input
            id="tip"
            name="tip"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            value="15"
            class="pad-end"
            aria-describedby="form-message"
          >
          <span class="affix affix-end" aria-hidden="true">%</span>
        </div>
      </div>

      <div class="field">
        <label for="people">Number of people</label>
        <div class="stepper">
          <button type="button" id="people-minus" aria-label="Decrease number of people">−</button>
          <input
            id="people"
            name="people"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            value="1"
            aria-describedby="people-hint form-message"
          >
          <button type="button" id="people-plus" aria-label="Increase number of people">+</button>
        </div>
        <p class="hint" id="people-hint">From 1 to 20 people.</p>
      </div>

      <p id="form-message" class="message" role="status" aria-live="polite"></p>

      <section class="results" aria-label="Calculated amounts">
        <p class="per-person">
          <span class="label">Total per person</span>
          <span id="per-person" class="amount is-empty">—</span>
        </p>
        <div class="split">
          <p class="stat">
            <span class="label">Tip amount</span>
            <span id="tip-amount" class="amount is-empty">—</span>
          </p>
          <p class="stat">
            <span class="label">Total bill</span>
            <span id="total-bill" class="amount is-empty">—</span>
          </p>
        </div>
      </section>

      <button type="button" class="reset" id="reset">Reset</button>
    </form>
  </main>

  <noscript>
    <p class="card">Enable JavaScript to use Tip Calculator. The page does not need an internet connection.</p>
  </noscript>

  <script>
    (function () {
      var PRESETS = [10, 15, 18, 20];
      var DEFAULT_TIP = "15";
      var MIN_PEOPLE = 1;
      var MAX_PEOPLE = 20;
      var MAX_BILL_CENTS = 99999999;

      var form = document.getElementById("tip-form");
      var billInput = document.getElementById("bill");
      var tipInput = document.getElementById("tip");
      var peopleInput = document.getElementById("people");
      var peopleMinus = document.getElementById("people-minus");
      var peoplePlus = document.getElementById("people-plus");
      var resetButton = document.getElementById("reset");
      var message = document.getElementById("form-message");
      var tipAmount = document.getElementById("tip-amount");
      var totalBill = document.getElementById("total-bill");
      var perPerson = document.getElementById("per-person");
      var presetButtons = Array.prototype.slice.call(document.querySelectorAll("[data-tip]"));

      var money = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      function formatCents(cents) {
        return money.format(cents / 100);
      }

      function parseBill(raw) {
        var value = raw.trim();
        if (value === "") {
          return { ok: false, message: "Enter a bill amount." };
        }
        if (value.charAt(0) === "-") {
          return { ok: false, message: "Bill amount cannot be negative." };
        }
        if (/^\d+\.$/.test(value)) {
          value = value.slice(0, -1);
        }
        if (!/^(?:\d+(?:\.\d{1,2})?|\.\d{1,2})$/.test(value)) {
          return { ok: false, message: "Enter a valid bill amount with up to two decimal places." };
        }
        var cents = Math.round(Number(value) * 100);
        if (!Number.isSafeInteger(cents)) {
          return { ok: false, message: "Enter a valid bill amount." };
        }
        if (cents > MAX_BILL_CENTS) {
          return { ok: false, message: "Enter a bill amount of $999,999.99 or less." };
        }
        return { ok: true, cents: cents };
      }

      function parseTip(raw) {
        var value = raw.trim();
        if (value === "") {
          return { ok: false, message: "Enter a tip percentage." };
        }
        if (value.charAt(0) === "-") {
          return { ok: false, message: "Tip percentage cannot be negative." };
        }
        if (/^\d+\.$/.test(value)) {
          value = value.slice(0, -1);
        }
        if (!/^(?:\d+(?:\.\d{1,2})?|\.\d{1,2})$/.test(value)) {
          return { ok: false, message: "Enter a valid tip percentage with up to two decimal places." };
        }
        var percent = Number(value);
        if (!Number.isFinite(percent)) {
          return { ok: false, message: "Enter a valid tip percentage." };
        }
        if (percent > 100) {
          return { ok: false, message: "Tip percentage must be between 0 and 100." };
        }
        return { ok: true, percent: percent };
      }

      function parsePeople(raw) {
        var value = raw.trim();
        if (value === "") {
          return { ok: false, message: "Enter the number of people." };
        }
        if (value.charAt(0) === "-") {
          return { ok: false, message: "Number of people must be between 1 and 20." };
        }
        if (!/^\d+$/.test(value)) {
          return { ok: false, message: "Number of people must be a whole number." };
        }
        var count = Number(value);
        if (!Number.isSafeInteger(count) || count < MIN_PEOPLE || count > MAX_PEOPLE) {
          return { ok: false, message: "Number of people must be between 1 and 20." };
        }
        return { ok: true, count: count };
      }

      function syncPresets(percent) {
        presetButtons.forEach(function (button) {
          var matches = percent !== null && Number(button.getAttribute("data-tip")) === percent;
          button.setAttribute("aria-pressed", matches ? "true" : "false");
        });
      }

      function setAmount(element, cents) {
        if (cents === null) {
          element.textContent = "—";
          element.classList.add("is-empty");
          return;
        }
        element.textContent = formatCents(cents);
        element.classList.remove("is-empty");
      }

      function setInvalid(input, invalid) {
        if (invalid) {
          input.setAttribute("aria-invalid", "true");
        } else {
          input.removeAttribute("aria-invalid");
        }
      }

      function updatePeopleButtons() {
        var parsed = parsePeople(peopleInput.value);
        peopleMinus.disabled = parsed.ok && parsed.count <= MIN_PEOPLE;
        peoplePlus.disabled = parsed.ok && parsed.count >= MAX_PEOPLE;
      }

      function showResults(tipCents, totalCents, eachCents) {
        setAmount(tipAmount, tipCents);
        setAmount(totalBill, totalCents);
        setAmount(perPerson, eachCents);
      }

      function calculate() {
        var bill = parseBill(billInput.value);
        var tip = parseTip(tipInput.value);
        var people = parsePeople(peopleInput.value);

        setInvalid(billInput, !bill.ok);
        setInvalid(tipInput, !tip.ok);
        setInvalid(peopleInput, !people.ok);
        syncPresets(tip.ok ? tip.percent : null);
        updatePeopleButtons();

        var errors = [];
        if (!bill.ok) errors.push(bill.message);
        if (!tip.ok) errors.push(tip.message);
        if (!people.ok) errors.push(people.message);

        if (errors.length > 0) {
          message.textContent = errors.join(" ");
          showResults(null, null, null);
          return;
        }

        var tipCents = Math.round((bill.cents * tip.percent) / 100);
        var totalCents = bill.cents + tipCents;
        var eachCents = Math.round(totalCents / people.count);

        if (!Number.isFinite(tipCents) || !Number.isFinite(totalCents) || !Number.isFinite(eachCents)) {
          message.textContent = "Those values cannot be calculated. Check the bill, tip, and number of people.";
          showResults(null, null, null);
          return;
        }

        message.textContent = "";
        showResults(tipCents, totalCents, eachCents);
      }

      function adjustPeople(delta) {
        var raw = peopleInput.value.trim();
        var next = MIN_PEOPLE;
        if (/^\d+$/.test(raw)) {
          var current = Number(raw);
          if (current > MAX_PEOPLE) {
            next = MAX_PEOPLE;
          } else if (current < MIN_PEOPLE) {
            next = MIN_PEOPLE;
          } else {
            next = current + delta;
          }
        }
        if (next < MIN_PEOPLE) next = MIN_PEOPLE;
        if (next > MAX_PEOPLE) next = MAX_PEOPLE;
        peopleInput.value = String(next);
        calculate();
      }

      function resetForm() {
        billInput.value = "";
        tipInput.value = DEFAULT_TIP;
        peopleInput.value = "1";
        calculate();
        billInput.focus();
      }

      billInput.addEventListener("input", calculate);
      tipInput.addEventListener("input", calculate);
      peopleInput.addEventListener("input", calculate);

      presetButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          tipInput.value = button.getAttribute("data-tip");
          calculate();
        });
      });

      peopleMinus.addEventListener("click", function () {
        adjustPeople(-1);
      });
      peoplePlus.addEventListener("click", function () {
        adjustPeople(1);
      });
      resetButton.addEventListener("click", resetForm);

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        calculate();
      });

      calculate();
    })();
  </script>
</body>
</html>
